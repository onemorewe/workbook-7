plugins { id 'com.android.application' }
android {
    namespace 'dev.noshorts.chrome'
    compileSdk 35
    testBuildType 'release'
    defaultConfig {
        applicationId 'dev.noshorts.chrome'; minSdk 26; targetSdk 35
        versionCode Integer.parseInt(System.getenv('NOSHORTS_VERSION_CODE') ?: '2')
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        stable {
            def keyPath = System.getenv('KEYSTORE_PATH')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.stable; minifyEnabled false }
        debug { if (System.getenv('KEYSTORE_PATH')) signingConfig signingConfigs.stable }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':core')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
