name: NoShorts signed Android verification

on:
  push:
    branches: ['noshorts/**']
    paths: ['noshorts/**', '.github/workflows/build-noshorts.yml']
  workflow_dispatch:
    inputs:
      chrome_apk_url:
        description: 'Optional HTTPS URL of Chrome 154.0.8037.126 x86_64 APK; Google signature is verified'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: noshorts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/noshorts-signing.jks"
          chmod 600 "$RUNNER_TEMP/noshorts-signing.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/noshorts-signing.jks" >> "$GITHUB_ENV"
          echo "NOSHORTS_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER * 2))" >> "$GITHUB_ENV"
      - name: Install SDK and prepare results
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p ci-results
      - name: Compile and run core tests, Android lint, signed release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/onemorewe/workbook-7/996991abf7b78ed499427ec4f90bd5bb480e09ca/dist/NoShorts-0.3.0.apk' -o ci-results/NoShorts-previous.apk
          echo '03803aeaca9725eb0a97935549f06ddd15a0d4defcf7c961305b8aec02acb4e4  ci-results/NoShorts-previous.apk' | sha256sum -c -
          gradle --no-daemon :core:verifyRules :app:lintRelease :app:assembleRelease :browser-tests:assembleDebug :browser-tests:assembleDebugAndroidTest --stacktrace
          bash ci/signature_check.sh
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: noshorts/.ci-cache/chrome154.apk
          key: noshorts-chrome154-47ab1990446ec45fdb2078b0c443a1e66aaea011f72705bdbf854ed0ffecde3f
      - name: Verify signed update and Chrome on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHROME_APK_URL: ${{ inputs.chrome_apk_url }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -memory 4096
          script: cd noshorts && bash ci/run_emulator.sh
      - uses: actions/cache/save@v4
        if: always() && env.NOSHORTS_CHROME_VERIFIED == 'true'
        continue-on-error: true
        with:
          path: noshorts/.ci-cache/chrome154.apk
          key: noshorts-chrome154-47ab1990446ec45fdb2078b0c443a1e66aaea011f72705bdbf854ed0ffecde3f
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoShorts-verification-${{ github.run_number }}
          path: |
            noshorts/ci-results/
            noshorts/app/build/reports/
            noshorts/browser-tests/build/reports/
            noshorts/browser-tests/build/outputs/androidTest-results/
          retention-days: 30
      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NoShorts-signed-${{ github.run_number }}
          path: noshorts/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/noshorts-signing.jks"
