name: Build ClosePaw GPT Voice

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone ClosePaw
        run: git clone --depth 1 https://github.com/imoonkey/closepaw.git closepaw

      - name: Add GPT voice transcription
        run: |
          cp patch_closepaw_voice.py closepaw/patch_closepaw_voice.py
          cd closepaw
          python3 patch_closepaw_voice.py

      - name: Build debug APK
        working-directory: closepaw
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-GPT-Voice
          path: closepaw/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
