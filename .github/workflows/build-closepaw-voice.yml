          for rel, reps in replacements.items():
              path = root / rel
              text = path.read_text(encoding='utf-8')
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f'Patch anchor not found in {rel}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

