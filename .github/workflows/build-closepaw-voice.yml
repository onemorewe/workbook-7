name: Build ClosePaw GPT Voice

on:
  push:
    branches: [main, alyosha-live-intent, alyosha-microwakeword, handsfree-crash-runtime-panel]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test ingest auth, validation, redaction and private read contract
        run: node --test trace-backend/tests/*.test.mjs
      - name: Apply migrations and test real Postgres permissions and retry deduplication
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ci-only-password
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -f trace-backend/tests/bootstrap.sql
          for migration in trace-backend/supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f trace-backend/tests/database.sql

  build:
    needs: trace-backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD'; exit 1; }

      - name: Clone ClosePaw
        run: git clone --depth 1 https://github.com/imoonkey/closepaw.git closepaw

      - name: Add GPT voice transcription
        run: |
          cp patch_closepaw_voice.py closepaw/patch_closepaw_voice.py
          cd closepaw
          python3 patch_closepaw_voice.py

      - name: Add voice UX improvements
        run: |
          cp patch_voice_ux.py closepaw/patch_voice_ux.py
          cd closepaw
          python3 patch_voice_ux.py

      - name: Add hands-free live intent mode
        run: |
          mkdir -p closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice
          mkdir -p closepaw/app/src/main/kotlin/ai/closepaw/ui/settings
          mkdir -p closepaw/app/src/androidTest/kotlin/ai/closepaw/ui/capsule/voice
          mkdir -p closepaw/app/src/androidTest/assets
          cp custom/HandsFreeCommandParser.kt closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice/HandsFreeCommandParser.kt
          cp custom/HandsFreeVoiceService.kt closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice/HandsFreeVoiceService.kt
          cp custom/HandsFreeSpeaker.kt closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice/HandsFreeSpeaker.kt
          cp custom/HandsFreeDebugRelay.kt closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice/HandsFreeDebugRelay.kt
          cp custom/LocalWakeWordDetector.kt closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice/LocalWakeWordDetector.kt
          cp custom/MicroFrontend.kt closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice/MicroFrontend.kt
          cp custom/RealtimeCommandTranscriber.kt closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice/RealtimeCommandTranscriber.kt
          cp custom/HandsFreeIntentGate.kt closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice/HandsFreeIntentGate.kt
          cp custom/VoiceRuntimeSettingsPage.kt closepaw/app/src/main/kotlin/ai/closepaw/ui/settings/VoiceRuntimeSettingsPage.kt
          cp custom/HandsFreeSafetyInstrumentedTest.kt closepaw/app/src/androidTest/kotlin/ai/closepaw/ui/capsule/voice/HandsFreeSafetyInstrumentedTest.kt
          cp custom/VoiceRuntimeUiInstrumentedTest.kt closepaw/app/src/androidTest/kotlin/ai/closepaw/ui/capsule/voice/VoiceRuntimeUiInstrumentedTest.kt

          curl -fL --retry 3 --retry-delay 2 -o /tmp/teya.tar.gz https://github.com/adgapar/teya/archive/b503872835ff3cafa8c399c4275e3e43c37d6577.tar.gz
          rm -rf /tmp/teya-src
          mkdir -p /tmp/teya-src
          tar -xzf /tmp/teya.tar.gz -C /tmp/teya-src --strip-components=1
          cp -R /tmp/teya-src/app/src/main/cpp closepaw/app/src/main/
          sed -i 's/Java_com_teya_agent_voice_MicroFrontend/Java_ai_closepaw_ui_capsule_voice_MicroFrontend/g' closepaw/app/src/main/cpp/microfrontend/MicroFrontend_jni.cpp

          mkdir -p closepaw/app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 -o closepaw/app/src/main/assets/wake_word.tflite https://raw.githubusercontent.com/esphome/micro-wake-word-models/05b65922cc433c9df13e98e32a7fe520758c837e/models/v2/hey_jarvis.tflite
          curl -fL --retry 3 --retry-delay 2 -o closepaw/app/src/main/assets/wake_word.json https://raw.githubusercontent.com/esphome/micro-wake-word-models/05b65922cc433c9df13e98e32a7fe520758c837e/models/v2/hey_jarvis.json

          cp patch_handsfree_integration.py closepaw/patch_handsfree_integration.py
          cp patch_handsfree_fix.py closepaw/patch_handsfree_fix.py
          cp patch_microwakeword_build.py closepaw/patch_microwakeword_build.py
          cp patch_handsfree_safety_panel.py closepaw/patch_handsfree_safety_panel.py
          cp patch_handsfree_start_order.py closepaw/patch_handsfree_start_order.py
          cp patch_handsfree_pipeline_reliability.py closepaw/patch_handsfree_pipeline_reliability.py
          cp patch_handsfree_observability.py closepaw/patch_handsfree_observability.py
          cp patch_handsfree_wake_diagnostics.py closepaw/patch_handsfree_wake_diagnostics.py
          cd closepaw
          python3 patch_handsfree_integration.py
          python3 patch_handsfree_fix.py
          python3 patch_microwakeword_build.py
          python3 patch_handsfree_safety_panel.py
          python3 patch_handsfree_start_order.py
          python3 patch_handsfree_pipeline_reliability.py
          python3 patch_handsfree_observability.py
          python3 patch_handsfree_wake_diagnostics.py

      - name: Inject private trace write token when configured
        env:
          TRACE_WRITE_TOKEN: ${{ secrets.TRACE_WRITE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get('TRACE_WRITE_TOKEN', '')
          path = Path('closepaw/app/src/main/kotlin/ai/closepaw/ui/capsule/voice/HandsFreeDebugRelay.kt')
          text = path.read_text(encoding='utf-8')
          placeholder = '__TRACE_WRITE_TOKEN__'
          if token:
              if placeholder not in text:
                  raise SystemExit('Private trace token placeholder missing')
              if not (32 <= len(token) <= 256) or not all(c.isalnum() or c in '_-' for c in token):
                  raise SystemExit('TRACE_WRITE_TOKEN has invalid format')
              path.write_text(text.replace(placeholder, token, 1), encoding='utf-8')
              print('Private trace write credential injected')
          else:
              print('TRACE_WRITE_TOKEN is not configured; ntfy fallback remains active')
          PY

      - name: Generate synthetic Hey Jarvis speech fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet edge-tts
          OUT="$GITHUB_WORKSPACE/closepaw/app/src/androidTest/assets/hey_jarvis_test.pcm"
          : > "$OUT"
          i=0
          for voice in en-US-GuyNeural en-US-JennyNeural en-US-ChristopherNeural en-GB-RyanNeural en-GB-SoniaNeural; do
            python3 -m edge_tts --voice "$voice" --text "Hey Jarvis" --write-media "/tmp/jarvis-$i.mp3"
            ffmpeg -v error -y -i "/tmp/jarvis-$i.mp3" -ar 24000 -ac 1 -f s16le "/tmp/jarvis-$i.pcm"
            cat "/tmp/jarvis-$i.pcm" >> "$OUT"
            dd if=/dev/zero bs=48000 count=1 status=none >> "$OUT"
            i=$((i+1))
          done
          test -s "$OUT"
          echo "Synthetic neural wake fixture bytes: $(wc -c < "$OUT")"

      - name: Run unit tests
        working-directory: closepaw
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run hands-free Android speech + UI sandbox
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: closepaw
          script: |
            set +e
            ./gradlew :app:connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=ai.closepaw.ui.capsule.voice.HandsFreeSafetyInstrumentedTest,ai.closepaw.ui.capsule.voice.VoiceRuntimeUiInstrumentedTest
            STATUS=$?
            echo "----- relevant emulator logcat -----"
            adb logcat -d -v threadtime | grep -E 'AndroidRuntime|HandsFree|ClosePaw|RealtimeCommandTranscriber|CodexResponseClient' | tail -n 500 || true
            exit $STATUS

      - name: Set custom version
        working-directory: closepaw
        run: |
          CODE=$((100000 + GITHUB_RUN_NUMBER))
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$CODE/" gradle.properties
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=0.1.0-custom.${GITHUB_RUN_NUMBER}/" gradle.properties
          echo "Building versionCode=$CODE"

      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/closepaw-custom.jks"
          chmod 600 "$GITHUB_WORKSPACE/closepaw-custom.jks"

      - name: Build signed release APK
        working-directory: closepaw
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/closepaw-custom.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs closepaw/app/build/outputs/apk/release/app-release.apk

      - name: Name APK
        run: cp closepaw/app/build/outputs/apk/release/app-release.apk "ClosePaw-GPT-Voice-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-GPT-Voice-signed-${{ github.run_number }}
          path: ClosePaw-GPT-Voice-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 90
